name: Supabase scrape worker

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: lead-scraper-supabase-worker
  cancel-in-progress: false

jobs:
  process-job:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Process one queued scrape job
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_WATCH_SECONDS: "1500"
          WORKER_POLL_SECONDS: "10"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_RESERVE: ${{ vars.SERPAPI_RESERVE }}
          SERPAPI_MAX_PER_RUN: ${{ vars.SERPAPI_MAX_PER_RUN }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          SEARCH_COUNTRY: ${{ secrets.SEARCH_COUNTRY }}
          REQUEST_DELAY_MIN: ${{ secrets.REQUEST_DELAY_MIN }}
          REQUEST_DELAY_MAX: ${{ secrets.REQUEST_DELAY_MAX }}
          TIMEOUT_SECONDS: ${{ secrets.TIMEOUT_SECONDS }}
          MAX_CONCURRENT_REQUESTS: ${{ secrets.MAX_CONCURRENT_REQUESTS }}
          MAX_RETRIES: ${{ secrets.MAX_RETRIES }}
          USER_AGENT_ROTATE: ${{ secrets.USER_AGENT_ROTATE }}
          RESPECT_ROBOTS: ${{ secrets.RESPECT_ROBOTS }}
          VERIFY_EMAILS: ${{ secrets.VERIFY_EMAILS }}
          INFER_EMAILS: ${{ secrets.INFER_EMAILS }}
          FREE_JS_RENDER: ${{ secrets.FREE_JS_RENDER }}
          CACHE_SEARCH: ${{ secrets.CACHE_SEARCH }}
          CACHE_SEARCH_HOURS: ${{ secrets.CACHE_SEARCH_HOURS }}
          SEARX_INSTANCES: ${{ secrets.SEARX_INSTANCES }}
        run: python scripts/supabase_worker.py
